<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="БУНКЕР 09">
  <title>БУНКЕР 09</title>
  <style>
    .sweep {
      transform-origin: 32px 32px;
      animation: radar-spin 4.2s linear infinite;
    }
    .blip {
      animation: radar-blip 2.1s ease-in-out infinite;
    }
    @keyframes radar-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes radar-blip {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sweep, .blip { animation: none; }
    }
  </style>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#10150e" stroke="#3d4932" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#2c3724" stroke-width="2"/>
  <circle cx="32" cy="32" r="11.5" fill="none" stroke="#303c27" stroke-width="1.6" stroke-dasharray="3.5 3.5"/>
  <g class="sweep">
    <path d="M32 32 L49 17.5 A22 22 0 0 1 53.5 32 Z" fill="#ff5b36" fill-opacity="0.34"/>
    <line x1="32" y1="32" x2="49" y2="17.5" stroke="#ff5b36" stroke-width="3" stroke-linecap="round"/>
  </g>
  <circle class="blip" cx="43" cy="24.5" r="3.2" fill="#ff5b36"/>
  <circle cx="32" cy="32" r="4.2" fill="#a9ce7c"/>
</svg>
